name: build

# 多平台构建：windows-x64 / linux-x64 / macos / android 在各自原生 runner 上构建，
# windows-arm64 无法在 GitHub x64 runner 上构建，由本机 tool/build.ps1 负责。
# 只产出可下载的 artifacts；不创建任何 Release —— 发布由人工另行确认执行。
on:
  push:
    branches: [main]

env:
  FLUTTER_VERSION: "3.47.2"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter analyze
      - run: flutter test

  windows-x64:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" `
            -DestinationPath "zeroapi-windows-x64-${{ github.ref_name }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: zeroapi-windows-x64-*.zip

  linux-x64:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release
      - run: tar czf "zeroapi-linux-x64-${{ github.ref_name }}.tar.gz" -C build/linux/x64/release bundle
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: zeroapi-linux-x64-*.tar.gz

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Package
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc zeroapi.app "zeroapi-macos-${{ github.ref_name }}.zip"
          cp zeroapi-macos-*.zip "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: zeroapi-macos-*.zip

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk "zeroapi-android-${{ github.ref_name }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: zeroapi-android-*.apk
